name: Checkov Security Scan

on:
  pull_request:
    paths:
      - "infra/app-chart/**/*.yaml"
      - "infra/app-chart/**/*.yml"
      - ".github/workflows/checkov-security-scan.yml"
  push:
    branches: [main]
    paths:
      - "infra/app-chart/**/*.yaml"
      - "infra/app-chart/**/*.yml"
      - ".github/workflows/checkov-security-scan.yml"
  workflow_dispatch:

jobs:
  checkov-scan:
    runs-on: ubuntu-latest
    name: Checkov - Kubernetes Security Scan
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Checkov
        run: |
          pip install checkov

      - name: Run Checkov scan on Helm chart templates
        run: |
          checkov --directory infra/app-chart/templates/ \
            --framework kubernetes \
            --output cli \
            --output sarif \
            --output-file-path . \
            --soft-fail
        continue-on-error: true

      - name: Upload Checkov SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results_sarif.sarif
          category: checkov-kubernetes

      - name: Display scan summary
        if: always()
        run: |
          echo "### Checkov Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scanned Kubernetes manifests in \`infra/app-chart/templates/\` directory." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For detailed results, check the Security tab in the repository." >> $GITHUB_STEP_SUMMARY

